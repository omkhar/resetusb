name: Dependency Review

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Read pull request metadata for dependency review analysis.

jobs:
  dependency-review:
    name: dependency-review
    if: github.repository_visibility == 'public' || vars.ENABLE_PRIVATE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
