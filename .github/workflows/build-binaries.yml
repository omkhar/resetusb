name: Build Binaries

# Publishes a signed build-* prerelease for each main commit that changes a
# shipped input. Signed v* releases still come only from release.yml.
on:
  push:
    branches: ["main"]
    paths:
      - resetusb.c
      - resetusb.h
      - resetusb.8
      - Makefile
      - docker/release-builder*
      - scripts/apt-get-retry.sh
      - scripts/build-release-artifacts.sh
      - scripts/docker-build-release-builder.sh
      - scripts/lib.sh
      - scripts/release-builder-base-image.sh
      - .github/workflows/build-binaries.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Check out the source and the release tags.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute build version
        id: version
        run: |
          set -euo pipefail
          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          head_sha="$(git rev-parse HEAD)"
          if [[ "${head_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Checked out ${head_sha}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi

          upstream_tag="$(
            git tag --list 'v*' --sort=-version:refname |
              grep -E "${semver_regex}" |
              sed -n '1p'
          )"
          if [[ -z "${upstream_tag}" ]]; then
            echo "No vMAJOR.MINOR.PATCH tag found" >&2
            exit 1
          fi

          stamp="$(TZ=UTC0 git log -1 --date=format-local:%Y%m%d%H%M --format=%cd HEAD)"
          version="${upstream_tag#v}+git${stamp}.g${head_sha:0:7}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+git[0-9]{12}\.g[0-9a-f]{7}$ ]]; then
            echo "Unexpected build version: ${version}" >&2
            exit 1
          fi

          source_date_epoch="$(git log -1 --format=%ct HEAD)"
          [[ "${source_date_epoch}" =~ ^[0-9]+$ ]]

          echo "Build version: ${version}"
          {
            printf 'version=%s\n' "${version}"
            printf 'source_date_epoch=%s\n' "${source_date_epoch}"
          } >> "${GITHUB_OUTPUT}"
      - name: Build release builder image
        run: |
          ./scripts/docker-build-release-builder.sh --platform=linux/amd64 \
            -f docker/release-builder.Dockerfile \
            -t "resetusb-release-builder:${GITHUB_SHA}" \
            .
      - name: Run unit tests in the release builder
        run: |
          docker run --rm --platform=linux/amd64 \
            -v "$PWD":/source \
            -w /source \
            "resetusb-release-builder:${GITHUB_SHA}" \
            bash -lc 'make clean && make test && make clean'
      - name: Build artifacts with the release builder
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          docker run --rm --platform=linux/amd64 \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            -e ARTIFACT_VERSION="${BUILD_VERSION}" \
            -e PACKAGE_VERSION="${BUILD_VERSION}" \
            -e SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            -e SOURCE_ROOT=/source \
            -e DIST_DIR=/source/dist \
            -e WORK_DIR=/tmp/resetusb-build \
            -v "$PWD":/source \
            -w /source \
            "resetusb-release-builder:${GITHUB_SHA}" \
            bash -lc '/source/scripts/build-release-artifacts.sh'
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Select and check build assets
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir publish

          for deb_arch in amd64 arm64 armhf; do
            source_deb="dist/resetusb-${BUILD_VERSION}-debian-${deb_arch}.deb"
            target_deb="publish/resetusb_${BUILD_VERSION}_${deb_arch}.deb"
            cp -- "${source_deb}" "${target_deb}"

            [[ "$(dpkg-deb -f "${target_deb}" Package)" == "resetusb" ]]
            [[ "$(dpkg-deb -f "${target_deb}" Version)" == "${BUILD_VERSION}" ]]
            [[ "$(dpkg-deb -f "${target_deb}" Architecture)" == "${deb_arch}" ]]
            dpkg-deb -c "${target_deb}" | grep -F ' ./usr/sbin/resetusb' >/dev/null
          done

          for tar_arch in amd64 arm64 armv7; do
            cp -- "dist/resetusb-${BUILD_VERSION}-linux-${tar_arch}.tar.gz" publish/
          done

          ls -l publish
      - name: Upload build assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-binaries
          path: publish/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create the build-* tag and its prerelease.
      id-token: write # Sign the build assets with a keyless Sigstore identity.
    steps:
      - name: Download build assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-binaries
          path: dist
      - name: Install cosign
        run: |
          set -euo pipefail
          version="v3.1.3"
          expected_sha256="4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
          install_dir="${RUNNER_TEMP}/bin"

          mkdir -p "$install_dir"
          curl --fail --show-error --silent --location \
            --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/sigstore/cosign/releases/download/${version}/cosign-linux-amd64" \
            --output "${install_dir}/cosign"

          echo "${expected_sha256}  ${install_dir}/cosign" | sha256sum --check --strict
          chmod +x "${install_dir}/cosign"
          echo "${install_dir}" >> "$GITHUB_PATH"
          "${install_dir}/cosign" version
      - name: Write checksums and sign assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist

          assets=(*.deb *.tar.gz)
          if [[ ${#assets[@]} -ne 6 ]]; then
            echo "Expected 6 build assets, found ${#assets[@]}" >&2
            exit 1
          fi

          sha256sum -- "${assets[@]}" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

          for file in "${assets[@]}" SHA256SUMS; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "${file}"
          done
      - name: Verify Sigstore signatures
        env:
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-binaries.yml@refs/heads/main"

          for file in "dist/resetusb_${BUILD_VERSION}_amd64.deb" dist/SHA256SUMS; do
            cosign verify-blob \
              --bundle "${file}.sigstore.json" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${file}"
          done
      - name: Publish build prerelease
        env:
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="build-${BUILD_VERSION}"
          notes_file="$(mktemp)"

          if gh release view "${tag}" --repo "${REPOSITORY}" --json isDraft >/dev/null 2>&1; then
            if [[ "$(gh release view "${tag}" --repo "${REPOSITORY}" --json isDraft -q '.isDraft')" != "true" ]]; then
              echo "${tag} is already published; nothing to do"
              exit 0
            fi
            gh release delete "${tag}" --repo "${REPOSITORY}" --yes
          fi

          {
            printf 'Automated build of %s from main.\n\n' "${GITHUB_SHA}"
            printf 'This prerelease is not a signed vMAJOR.MINOR.PATCH release.\n'
            printf 'Verify each asset with SHA256SUMS and its Sigstore bundle.\n'
            printf 'Signer identity: https://github.com/%s/.github/workflows/build-binaries.yml@refs/heads/main\n' \
              "${REPOSITORY}"
          } > "${notes_file}"

          mapfile -t files < <(find dist -maxdepth 1 -type f | sort)
          gh release create "${tag}" "${files[@]}" \
            --repo "${REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "resetusb ${BUILD_VERSION}" \
            --notes-file "${notes_file}" \
            --draft \
            --prerelease \
            --latest=false

          expected_assets="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          actual_assets="$(
            gh release view "${tag}" --repo "${REPOSITORY}" --json assets -q '.assets[].name' |
              LC_ALL=C sort
          )"
          if [[ "${expected_assets}" != "${actual_assets}" ]]; then
            echo "Release assets differ from the build assets" >&2
            diff <(printf '%s\n' "${expected_assets}") <(printf '%s\n' "${actual_assets}") >&2 || true
            exit 1
          fi

          gh release edit "${tag}" --repo "${REPOSITORY}" \
            --draft=false \
            --prerelease \
            --latest=false
